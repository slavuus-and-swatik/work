# Include inside the chosen HTTPS server block; preserve existing TLS settings.
client_max_body_size 6m;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header X-Frame-Options SAMEORIGIN always;
location = / { return 302 /studio; }
location ~ ^/(studio(?:/|$)|review/|s/|api/detailing/|api/platform-admin/session$|_next/static/|detailing-hero\.png$|favicon\.svg$|apple-touch-icon\.png$) {
    proxy_pass http://127.0.0.1:3017;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
location / { return 404; }
